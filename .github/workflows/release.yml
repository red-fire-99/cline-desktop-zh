name: 📦 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v1.0.13)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 版本号一致性检查
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          if (-not ($changelog -match "## \[$version\]")) {
            throw "CHANGELOG.md 缺少 [$version] 版本记录"
          }
          Write-Host "✅ CHANGELOG 包含 [$version]"

      - name: 运行自检
        run: node tools/validate.mjs

      - name: 运行测试
        run: |
          node test/lookup-test.mjs
          node test/scan-missing-test.mjs
          node test/dict-build-test.mjs

      - name: 打包 slim zip（仅 git 跟踪文件，不含 node/ vendor/ logs/）
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $zipName = "cline-desktop-zh-${tag}-slim.zip"
          git archive --format=zip --prefix="cline-desktop-zh-${tag}/" --output=$zipName HEAD
          Write-Host "打包完成: $zipName ($(($zipName | Get-Item).Length / 1KB) KB)"

      - name: 生成 Release Notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          # 提取当前版本的更新日志片段
          $pattern = "## \\[${version}\\]"
          $start = $changelog.IndexOf($pattern)
          if ($start -lt 0) { throw "CHANGELOG 未找到 [$version]" }
          $next = $changelog.IndexOf("## [", $start + 3)
          $body = if ($next -gt 0) { $changelog.Substring($start, $next - $start) } else { $changelog.Substring($start) }
          # 限制长度
          $body = $body.Substring(0, [Math]::Min(65535, $body.Length))
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 创建/更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "${{ github.event.inputs.tag || github.ref_name }} · Cline 桌面版中文界面（汉化版 / Chinese UI）"
          body_path: ${{ steps.notes.outputs.body }}
          files: cline-desktop-zh-${{ github.event.inputs.tag || github.ref_name }}-slim.zip
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}